<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groww for GenZ: interactive prototype by Apoorva Pandey</title>
<meta name="author" content="Apoorva Pandey">
<meta name="description" content="A first-investment experience for 20 to 26 year olds: goal-based plans from ₹100, a calm view of the market, and guardrails before risky products.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --mint:#00D09C; --mint-ink:#04281D; --mint-text:#00744F; --mint-soft:#D6F7EC;
  --ink:#102A33; --ink-2:#3A525C; --ink-3:#566A72;
  --paper:#F5F8F6; --page:#DCE6E2; --surface:#FFFFFF; --surface-2:#EDF3F0; --line:#D5E1DC;
  --sun:#FFC53D; --sun-ink:#3D2A00; --sun-text:#8A5800; --sun-soft:#FFF3D1;
  --lilac:#6A4FF0; --lilac-text:#5338D6; --lilac-soft:#ECE8FF;
  --coral:#B42D2D; --coral-soft:#FBE6E6; --coral-fill:#E5484D;
  --sky:#2F7BEA; --sky-text:#1F63C6; --sky-soft:#E3EEFD;
  --amber:#E59A00; --amber-text:#8A5800; --amber-soft:#FDF1D8;
  --chart-growth:#00A97E; --chart-safe:#2F7BEA; --chart-balanced:#D98A00;
  --focus:#6A4FF0;
  --bezel:#0E1F25;
  --font-display:"Anek Latin","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-text:"Mukta","Noto Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mint-text:#3EE3B4; --mint-soft:#0F3A30;
    --ink:#E8F3F0; --ink-2:#B9CBC7; --ink-3:#93A9A8;
    --paper:#0B1A1F; --page:#061115; --surface:#12262C; --surface-2:#183139; --line:#25424B;
    --sun-text:#FFCF5C; --sun-soft:#3A2E0A;
    --lilac-text:#B1A3FF; --lilac-soft:#241D4D;
    --coral:#FF7A7A; --coral-soft:#3A1717;
    --sky-text:#86B8FF; --sky-soft:#13294A;
    --amber-text:#FFC14D; --amber-soft:#3A2A08;
    --chart-growth:#2EE6B0; --chart-safe:#6FA6FF; --chart-balanced:#FFC14D;
    --focus:#B1A3FF; --bezel:#000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mint-text:#3EE3B4; --mint-soft:#0F3A30;
  --ink:#E8F3F0; --ink-2:#B9CBC7; --ink-3:#93A9A8;
  --paper:#0B1A1F; --page:#061115; --surface:#12262C; --surface-2:#183139; --line:#25424B;
  --sun-text:#FFCF5C; --sun-soft:#3A2E0A;
  --lilac-text:#B1A3FF; --lilac-soft:#241D4D;
  --coral:#FF7A7A; --coral-soft:#3A1717;
  --sky-text:#86B8FF; --sky-soft:#13294A;
  --amber-text:#FFC14D; --amber-soft:#3A2A08;
  --chart-growth:#2EE6B0; --chart-safe:#6FA6FF; --chart-balanced:#FFC14D;
  --focus:#B1A3FF; --bezel:#000;
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--page)}
body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:var(--font-text);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
dl,dd{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- type ---------- */
.h1{font-family:var(--font-display);font-weight:800;font-stretch:116%;font-size:28px;line-height:1.08;letter-spacing:-.01em;margin:0}
.h2{font-family:var(--font-display);font-weight:700;font-stretch:108%;font-size:21px;line-height:1.18;margin:0}
.h3{font-family:var(--font-display);font-weight:700;font-stretch:104%;font-size:17px;line-height:1.25;margin:0}
.lead{font-size:17px;color:var(--ink-2)}
.small{font-size:15px;color:var(--ink-2)}
.tiny{font-size:13px;color:var(--ink-3);line-height:1.4}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums lining-nums;font-weight:700;font-stretch:104%}
.num small{font-family:var(--font-text);font-weight:500;font-size:15px;color:var(--ink-3);font-stretch:100%}
.big{font-size:36px;line-height:1.05}
.xl{font-size:36px;line-height:1.05}
.up{color:var(--mint-text)} .down{color:var(--coral)}
.center{text-align:center}
.mt{margin-top:28px} .mt-s{margin-top:14px}
b{font-weight:600}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
.presenter{width:300px;max-height:100%;overflow:auto;padding:4px}
.presenter .p-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-stretch:112%;font-size:21px}
.presenter .p-brand svg{width:30px;height:30px}
.presenter .p-brand span{font-weight:600;color:var(--ink-3);font-size:17px}
.presenter .p-lead{margin:14px 0 22px;color:var(--ink-2);font-size:15px}
.presenter h2{font-family:var(--font-display);font-weight:700;font-size:15px;margin:0 0 8px;color:var(--ink-3)}
.tour{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.tour button{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:100%;min-height:52px;padding:8px 12px;border:0;border-radius:14px;background:transparent;text-align:left}
.tour button:hover{background:var(--surface)}
.tour b{font-family:var(--font-display);font-weight:700;font-size:16px;font-stretch:104%}
.tour small{font-size:13px;color:var(--ink-3)}
.p-prefs{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.p-fine{font-size:13px;color:var(--ink-3)}

.phone{position:relative;width:390px;height:min(844px,100%);border-radius:50px;background:var(--paper);box-shadow:0 0 0 11px var(--bezel),0 0 0 12px #2A4650,0 40px 90px -30px rgba(6,26,32,.55);overflow:hidden;flex:none}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.statusbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-family:var(--font-display);font-weight:700;font-size:15px}
.statusbar svg{height:12px;width:auto;fill:currentColor}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:4px 6px 8px}
.tab{min-height:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:500;color:var(--ink-3);border-radius:14px}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--mint-text);font-weight:700}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.demo-fab{display:none;position:absolute;right:14px;bottom:84px;z-index:30;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font-family:var(--font-display);font-weight:700;font-size:15px;align-items:center;gap:6px;box-shadow:0 8px 24px -8px rgba(6,26,32,.5)}
.demo-fab .ic{width:18px;height:18px}
.app.no-tabs .demo-fab{bottom:20px}
@media (max-width:899px){
  .stage{padding:0;gap:0;display:block}
  .presenter{display:none}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .statusbar{display:none}
  .demo-fab{display:inline-flex}
}
@media (max-height:700px) and (min-width:900px){ .phone{border-radius:36px} }

/* ---------- layout pieces ---------- */
.scr{padding:12px 20px 32px}
.appbar{display:flex;align-items:center;gap:6px;margin:-4px -10px 10px;min-height:48px}
.appbar-t{font-family:var(--font-display);font-weight:700;font-size:17px;font-stretch:104%;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border:0;border-radius:14px;background:transparent;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--surface-2)}
.sticky-cta{position:sticky;bottom:0;margin:24px -20px -32px;padding:14px 20px 18px;background:linear-gradient(to bottom,transparent,var(--paper) 22%);display:flex;flex-direction:column;gap:8px}
.cta-stack{display:flex;flex-direction:column;gap:10px;margin-top:22px}

/* ---------- controls ---------- */
.btn{min-height:52px;border:0;border-radius:16px;padding:0 20px;font-family:var(--font-display);font-weight:700;font-size:17px;font-stretch:106%;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--mint);color:var(--mint-ink);transition:transform .12s ease}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.lilac{background:var(--lilac);color:#fff}
.btn.sm{min-height:44px;font-size:15px;border-radius:13px;padding:0 14px}
.btn-row{display:flex;gap:8px}
.link{background:none;border:0;color:var(--mint-text);font-weight:600;min-height:44px;padding:0;font-size:15px}
.field{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;font-size:17px;color:var(--ink)}
.field::placeholder{color:var(--ink-3)}
.field:focus{border-color:var(--mint);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 30%,transparent)}
.area{min-height:132px;resize:vertical;line-height:1.4}
input[type=range]{width:100%;height:44px;margin:4px 0;accent-color:var(--mint);background:transparent}
.lbl{display:block;font-size:15px;color:var(--ink-2);margin-top:18px}
.amount{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-soft);color:var(--ink)}
.chip.sm{min-height:44px;padding:0 13px;font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:11px;background:none;font-weight:600;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,42,51,.14)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:64px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.setting>span:first-child{display:flex;flex-direction:column}
.setting small{font-size:14px;color:var(--ink-3)}
.setting.static{cursor:default}
.setting .seg{min-width:170px}
.switch-ui{position:relative;width:52px;height:32px;border-radius:99px;background:var(--line);flex:none;transition:background .2s}
.switch-ui::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
[aria-checked="true"] .switch-ui{background:var(--mint)}
[aria-checked="true"] .switch-ui::after{transform:translateX(20px)}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:44px;border:0;background:none;text-align:left;padding:8px 0;font-size:15px;color:var(--ink-2)}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;margin-top:1px}
.check[aria-checked="true"] .box{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.check .box .ic{width:16px;height:16px;stroke-width:3}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--mint-text);cursor:help;display:inline}

/* ---------- chips for buckets ---------- */
.bk{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;line-height:1.5;vertical-align:middle}
.bk.safe{background:var(--sky-soft);color:var(--sky-text)}
.bk.balanced{background:var(--amber-soft);color:var(--amber-text)}
.bk.growth{background:var(--mint-soft);color:var(--mint-text)}
.pill{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px}
.pill.active{background:var(--mint-soft);color:var(--mint-text)}
.pill.paused{background:var(--amber-soft);color:var(--amber-text)}

/* ---------- bars ---------- */
.bar{display:block;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--chart-growth);transition:width .5s ease}
.bar.safe>i{background:var(--chart-safe)} .bar.balanced>i{background:var(--chart-balanced)}
.bar.lilac>i{background:var(--lilac)} .bar.thick{height:12px}
.bar.high>i{background:var(--coral-fill)} .bar.medium>i{background:var(--amber)} .bar.low>i{background:var(--chart-growth)}

/* ---------- welcome ---------- */
.welcome{min-height:100%;display:flex;flex-direction:column;padding:18px 20px 22px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-stretch:112%;font-size:21px}
.mark svg{width:32px;height:32px}
.hero{font-family:var(--font-display);font-weight:800;font-stretch:125%;font-size:46px;line-height:.96;letter-spacing:-.02em;margin:30px 0 14px}
.hero-chart{margin:22px 0 0;padding:0}
.hero-chart figcaption{margin-top:10px}
.welcome .cta-stack{margin-top:auto;padding-top:22px}

/* ---------- onboarding ---------- */
.obtop{display:flex;align-items:center;gap:8px;margin:-4px -10px 18px}
.obbar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-right:10px}
.obbar i{display:block;height:100%;background:var(--mint);border-radius:inherit;transition:width .3s ease}
.ob .h1{margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{display:flex;gap:14px;align-items:center;width:100%;min-height:68px;padding:12px 16px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-soft)}
.opt-e{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--surface-2);color:var(--ink-2);flex:none}
.opt[aria-pressed="true"] .opt-e{background:var(--surface);color:var(--mint-text)}
.opt b{display:block;font-family:var(--font-display);font-weight:700;font-size:17px;font-stretch:104%}
.opt small{display:block;font-size:14px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{min-height:96px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:14px;text-align:left;font-weight:600;font-size:15px;color:var(--ink)}
.tile-e{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--ink-2)}
.tile[aria-pressed="true"] .tile-e{background:var(--surface);color:var(--mint-text)}
.tile[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-soft)}
.comfort{font-size:15px;font-weight:600;margin-top:2px}
.comfort.ok{color:var(--mint-text)} .comfort.mid{color:var(--ink-2)} .comfort.hot{color:var(--amber-text)} .comfort.warn{color:var(--coral)}

/* ---------- plan ---------- */
.alloc{display:flex;gap:3px;height:14px;margin:18px 0 6px}
.alloc i{border-radius:99px;min-width:8px}
.alloc i.safe{background:var(--chart-safe)} .alloc i.balanced{background:var(--chart-balanced)} .alloc i.growth{background:var(--chart-growth)}
.prow{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:start;width:100%;padding:16px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.prow-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.prow-main b{font-family:var(--font-display);font-weight:700;font-size:17px;font-stretch:104%}
.prow-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--ink-3)}
.prow-amt{font-size:21px;text-align:right;white-space:nowrap}
.note{display:block;font-size:14px;color:var(--amber-text);background:var(--amber-soft);border-radius:12px;padding:8px 10px;margin-top:4px}
.why{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.why li{position:relative;padding-left:22px;font-size:16px;color:var(--ink-2)}
.why li::before{content:"";position:absolute;left:2px;top:9px;width:9px;height:9px;border-radius:3px;background:var(--mint)}

/* ---------- status text ---------- */
.st{font-size:14px;font-weight:600}
.st.ok{color:var(--mint-text)} .st.behind{color:var(--amber-text)} .st.unfunded,.st.paused{color:var(--coral)} .st.long{color:var(--ink-3)} .st.done{color:var(--mint-text)}

/* ---------- futures chart (signature) ---------- */
.fut{margin:12px 0 0;padding:0}
.futures{width:100%;height:auto;display:block;overflow:visible}
.futures{--c:var(--chart-growth)} .futures.safe{--c:var(--chart-safe)} .futures.balanced{--c:var(--chart-balanced)}
.futures .band{fill:var(--c);opacity:.12}
.futures .strand{fill:none;stroke:var(--c);stroke-width:1;opacity:.3}
.futures .median{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.futures .inv{fill:none;stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 5}
.futures .base{stroke:var(--line);stroke-width:1}
.futures.draw .strand,.futures.draw .median{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s cubic-bezier(.3,.6,.2,1) forwards}
.futures.draw .median{animation-delay:.55s}
.futures.draw .band{opacity:0;animation:bandin .9s .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bandin{to{opacity:.12}}
.axis{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-top:4px}
.outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 10px}
.outcomes div{border-top:3px solid var(--line);padding-top:8px}
.outcomes div:nth-child(2){border-color:var(--c-strong,var(--chart-growth))}
.outcomes dt{font-size:13px;color:var(--ink-3)}
.outcomes dd{font-size:21px}
.fut.safe{--c-strong:var(--chart-safe)} .fut.balanced{--c-strong:var(--chart-balanced)}
.fut figcaption{margin-top:6px}

/* ---------- home ---------- */
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:6px}
.calm-row{margin-top:10px;border-top:1px solid var(--line)}
.goals{margin-top:4px}
.goal{display:grid;grid-template-columns:48px 1fr auto;column-gap:14px;row-gap:6px;align-items:center;width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.ico .ic{width:24px;height:24px}
.ico.safe{background:var(--sky-soft);color:var(--sky-text)} .ico.balanced{background:var(--amber-soft);color:var(--amber-text)} .ico.growth{background:var(--mint-soft);color:var(--mint-text)}
.ico.big{width:64px;height:64px;border-radius:20px}
.ico.big .ic{width:30px;height:30px}
.goal .ico{grid-row:1 / span 3}
.g-name{font-family:var(--font-display);font-weight:700;font-size:17px;font-stretch:104%}
.g-amt{font-size:17px;text-align:right}
.g-amt small{display:block;font-size:13px}

/* ===== Monte Carlo futures ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function quant(s,p){const i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo);}
const SIM_CACHE=new Map();
function simulate({start=0,monthly=0,months=120,bucket='growth',n=400,strands=60,seed=42}={}){
  months=Math.max(1,Math.round(months));
  const key=[start,monthly,months,bucket,n,strands,seed].join('|');
  if(SIM_CACHE.has(key)) return SIM_CACHE.get(key);
  const b=BUCKETS[bucket], r=mulberry32(seed);
  const mm=Math.log(1+b.mu)/12, ss=b.sigma/Math.sqrt(12);
  const vals=new Float64Array(n).fill(start), tmp=new Float64Array(n);
  const p10=[start],p50=[start],p90=[start],inv=[start];
  const paths=Array.from({length:Math.min(strands,n)},()=>[start]);
  let invested=start;
  for(let m=1;m<=months;m++){
    invested+=monthly;
    for(let i=0;i<n;i++) vals[i]=(vals[i]+monthly)*Math.exp(mm+ss*gauss(r));
    for(let k=0;k<paths.length;k++) paths[k].push(vals[k]);
    tmp.set(vals); tmp.sort();
    p10.push(quant(tmp,.1)); p50.push(quant(tmp,.5)); p90.push(quant(tmp,.9)); inv.push(invested);
  }
  let below=0; for(let i=0;i<n;i++) if(vals[i]<invested-1e-9) below++;
  const out={P:{p10,p50,p90},inv,paths,months,bucket,invested,pLoss:below/n,end:{p10:p10[months],p50:p50[months],p90:p90[months]}};
  if(SIM_CACHE.size>80) SIM_CACHE.clear();
  SIM_CACHE.set(key,out); return out;
}
function futuresSVG(sim,{draw=false,label=''}={}){
  const W=340,H=190,L=2,R=2,T=8,B=8,n=sim.months;
  let ymax=Math.max(sim.inv[n]*1.15,1); for(const v of sim.P.p90) if(v*1.12>ymax) ymax=v*1.12;
  const x=m=>L+(W-L-R)*m/n, y=v=>T+(H-T-B)*(1-Math.min(v,ymax*1.04)/ymax);
  const step=Math.max(1,Math.ceil(n/90)); const idx=[]; for(let m=0;m<=n;m+=step) idx.push(m); if(idx[idx.length-1]!==n) idx.push(n);
  const line=a=>idx.map((m,i)=>(i?'L':'M')+x(m).toFixed(1)+' '+y(a[m]).toFixed(1)).join('');
  const band=line(sim.P.p90)+idx.slice().reverse().map(m=>'L'+x(m).toFixed(1)+' '+y(sim.P.p10[m]).toFixed(1)).join('')+'Z';
  const strands=sim.paths.map(p=>`<path class="strand" pathLength="1" d="${line(p)}"/>`).join('');
  return `<svg class="futures ${sim.bucket}${draw?' draw':''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||'Simulated futures over '+horizonLabel(n))}"><line class="base" x1="0" x2="${W}" y1="${H-B}" y2="${H-B}"/><path class="band" d="${band}"/>${strands}<path class="inv" d="${line(sim.inv)}"/><path class="median" pathLength="1" d="${line(sim.P.p50)}"/></svg>`;
}
function futuresBlock(sim,{draw=false,label=''}={}){
  const b=BUCKETS[sim.bucket];
  return `<figure class="fut ${sim.bucket}">${futuresSVG(sim,{draw,label})}<div class="axis" aria-hidden="true"><span>Now</span><span>${horizonLabel(sim.months)}</span></div><dl class="outcomes"><div><dt>Bad luck</dt><dd class="num">${inrS(sim.end.p10)}</dd></div><div><dt>Typical</dt><dd class="num">${inrS(sim.end.p50)}</dd></div><div><dt>Good luck</dt><dd class="num">${inrS(sim.end.p90)}</dd></div></dl><p class="small">You'd put in ${inrS(sim.invested)}. Chance of ending below that: <b class="ploss">${lossPct(sim.pLoss)}</b>.</p><figcaption class="tiny">Simulation with assumed returns. Illustrative, not guaranteed. ${b.label} assumes about ${(b.mu*100).toFixed(1).replace(/\.0$/,'')}% a year. Bad and good luck are the 1-in-10 cases.</figcaption></figure>`;
}

  const hasFuture=types.includes('future'), exploring=types.includes('explore');
  const set=new Set(types.map(t=>t==='explore'?'future':t));
  return GOAL_ORDER.filter(t=>set.has(t)).map(t=>newGoal(t,user,t==='future'&&exploring&&!hasFuture));
}
function assignBuckets(goals,vibe){
  for(const g of goals){ let b=bucketFor(g); g.softened=false;
    if(g.forceBucket) b=g.forceBucket; else if(g.longterm&&vibe==='sell'){ b='balanced'; g.softened=true; }
    g.bucket=b; g.fundId=BUCKETS[b].fund; }
}
function allocate(goals,M){
  const lt=goals.filter(g=>g.longterm), dl=goals.filter(g=>!g.longterm);
  dl.forEach(g=>{ g.need=up50(g.target/g.months); g.sip=0; }); lt.forEach(g=>{ g.need=0; g.sip=0; });
  const reserve=lt.length?Math.min(M,Math.max(100,dn50(M*.2))):0;
  let avail=M-reserve; const needSum=dl.reduce((s,g)=>s+g.need,0);
  if(needSum<=avail){ dl.forEach(g=>g.sip=g.need); avail-=needSum; }
  else {
    const em=dl.find(g=>g.type==='emergency');
    if(em){ em.sip=Math.min(em.need,dn50(avail*.5)); avail-=em.sip; }
    const others=dl.filter(g=>g!==em), oNeed=others.reduce((s,g)=>s+g.need,0);
    others.forEach(g=>{ g.sip=Math.min(g.need,dn50(avail*g.need/oNeed)); });
    avail-=others.reduce((s,g)=>s+g.sip,0);
    for(const g of [em,...others].filter(Boolean)){ const add=Math.min(g.need-g.sip,avail); g.sip+=add; avail-=add; }
  }
  if(lt.length){ lt[0].sip=reserve+avail; avail=0; }
  else if(avail>0&&dl.length){ (dl.find(g=>g.type==='emergency')||dl[0]).sip+=avail; avail=0; }
  for(let guard=0;guard<24;guard++){
    const s=goals.find(g=>g.sip>0&&g.sip<100); if(!s) break;
    const t=goals.filter(g=>g!==s).sort((a,b)=>b.sip-a.sip)[0]; if(!t) break;
    t.sip+=s.sip; s.sip=0;
  }
  return goals;
}

function goalStatus(g){
  if(g.longterm) return g.paused?{kind:'paused',text:'SIP paused'}:{kind:'long',text:g.exploring?'Starting small while you explore':'Long game, 10+ years'};
  if(g.target&&g.value>=g.target) return {kind:'done',text:'Goal reached'};
  if(g.paused) return {kind:'paused',text:'SIP paused'};
  if(g.sip<=0) return {kind:'unfunded',text:'Not funded yet'};
  const left=Math.max(0,g.months-goalAge(g)), need=Math.ceil(Math.max(0,g.target-g.value)/g.sip);
  const due=addMonths(S.startDate,(g.startOffset||0)+g.months);
  if(need<=left) return {kind:'ok',text:`On track for ${monthYear(due)}`};
  return {kind:'behind',text:`At this pace: ${monthYear(addMonths(today(),need))}`};
}

  for(const r of TIP_GOOD){ const f=uniq(t.match(r.re)||[]); if(f.length){ score+=r.w; good.push({t:r.t,why:r.why}); } }
  score=clamp(score,0,100); return {score,level:score>=60?'high':score>=25?'medium':'low',flags,good}; }

  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'), ctx=c&&c.getContext?c.getContext('2d'):null; if(!ctx) return;
  const app=$('#app'), W=c.width=app.clientWidth, H=c.height=app.clientHeight, cols=['#00D09C','#FFC53D','#6A4FF0','#2F7BEA','#FF7A7A'];
  const ps=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*80,y:H*.32,vx:(Math.random()-.5)*9,vy:-Math.random()*10-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let t=0; (function f(){ ctx.clearRect(0,0,W,H); t++; for(const p of ps){ p.vy+=.32; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); } if(t<120) requestAnimationFrame(f); else ctx.clearRect(0,0,W,H); })();
}

  const rows=pool.map(g=>{ const v=dn50(amount*(g.sip||1)/W); left-=v; return {g,v}; }); if(rows.length){ rows.sort((a,b)=>b.v-a.v); rows[0].v+=left; } return rows.filter(r=>r.v>0); }

  for(let i=0;i<n;i++){ const k=(S.monthsElapsed+i)%12; let any=false;

      if(!g.longterm&&g.target&&g.value>=g.target) continue;

    if(S.roundups.on){ const g=goalById(S.roundups.goalId); if(g){ g.value+=600; g.invested+=600; any=true; } }
    if(any) S.streak++; else if(S.user.persona==='freelance'&&S.skipPasses>0) S.skipPasses--; else S.streak=0; }

  {act:'demo-restart',t:'Start over',d:'Onboard as yourself'},
  {act:'demo-sample',t:'Load a sample user',d:'Skip ahead as Arjun, a first-jobber'},
  {act:'demo-payday',t:'Simulate payday',d:'Salary or stipend lands'},
  {act:'demo-dip',t:S.market==='dip'?'End the dip':'Simulate a market dip',d:'Nifty 50 falls 4.1% in a day'},
  {act:'demo-ff',t:'Fast-forward 6 months',d:'Watch the habit build'},
  {act:'demo-license',t:'Try to unlock F&O',d:"The Learner's License"},
  {act:'demo-tip',t:'Check a hot tip',d:'Tip Check'}];
const prefsHTML=()=>`<div class="p-prefs"><button type="button" class="setting" role="switch" aria-checked="${S.lang==='hi'}" data-act="demo-lang"><span><b>Hinglish explanations</b><small>For the money-word decoder</small></span><span class="switch-ui" aria-hidden="true"></span></button><button type="button" class="setting" role="switch" aria-checked="${isDark()}" data-act="demo-theme"><span><b>Dark theme</b><small>Or follow your system</small></span><span class="switch-ui" aria-hidden="true"></span></button></div>`;
const tourHTML=()=>`<div class="tour">${DEMO_ITEMS().map(d=>`<button type="button" data-act="${d.act}"><b>${d.t}</b><small>${d.d}</small></button>`).join('')}</div>`;
function renderPresenter(){ const p=$('#presenter'); if(!p) return;
  p.innerHTML=`<div class="p-brand">${LOGO}<div>Groww <span>for GenZ</span></div></div><p class="p-lead">An interactive prototype of a first-investment experience for 20 to 26 year olds. Click through the phone, or jump straight to a moment below.</p><h2>Try these moments</h2>${tourHTML()}<h2>Preferences</h2>${prefsHTML()}<p class="p-fine">Prototype by Apoorva Pandey for the Groww Product Intern case study. Funds, prices and returns are illustrative. Not investment advice.</p>`; }

/* ===== stories ===== */
function openStory(id){ S.story={id,i:0,answer:null,gained:0}; renderStory(); }
function closeStory(){ S.story=null; renderStory(); }
function renderStory(){ const root=$('#story-root'); if(!root) return; const st=S.story; if(!st){ root.innerHTML=''; return; }
  const L=LESSONS.find(l=>l.id===st.id), total=L.slides.length+1, i=st.i, quiz=i>=L.slides.length;
  const bars=Array.from({length:total},(_,k)=>`<i class="${k<=i?'on':''}"></i>`).join(''); let body;
  if(!quiz){ const s=L.slides[i], b=typeof s.b==='function'?s.b():s.b;
    body=`<div class="slide"${s.quote?' data-quote':''}><h2 class="stt">${esc(s.t)}</h2><p class="sb">${esc(b)}</p></div><div class="snav"><button type="button" data-act="story-prev" aria-label="Previous slide"></button><button type="button" data-act="story-next" aria-label="Next slide"></button></div>`; }
  else { const q=L.quiz, a=st.answer;
    body=`<div class="slide"${q.quote?' data-quote':''}><span class="lab">Quick check</span><h2 class="stt">${esc(q.q)}</h2><div class="qopts">${q.opts.map((o,k)=>`<button type="button" class="qopt${a!==null?(k===q.a?' right':(k===a?' wrong':'')):''}" data-act="story-answer" data-k="${k}" ${a!==null?'disabled':''}>${esc(o)}</button>`).join('')}</div>
    ${a!==null?`<p class="sb">${a===q.a?'Correct. ':'Not quite. '}${esc(q.why)}</p><p class="xp">${st.gained?`+${st.gained} XP`:'Already done. No extra XP.'}</p><button type="button" class="btn" data-act="story-close">Done</button>`:'<button type="button" class="btn quiet" data-act="story-prev" style="background:rgba(255,255,255,.14);color:#fff">Back</button>'}</div>`; }
  root.innerHTML=`<div class="story" style="--story:${L.color}" role="dialog" aria-modal="true" aria-label="${esc(L.title)}"><div class="bars" aria-hidden="true">${bars}</div><button type="button" class="iconbtn x" data-act="story-close" aria-label="Close">${ic('close')}</button>${body}</div>`; }

/* ===== actions ===== */
const ACT={
  back:()=>back(), tab:el=>tab(el.dataset.tab), 'sheet-close':()=>closeSheet(),
  'ob-start':()=>{ S.ob={step:1,name:'',persona:null,band:null,monthly:0,goals:[],vibe:null}; go('ob'); },
  'ob-back':()=>{ if(S.ob.step>1){ S.ob.step--; render(); } else back(); },
  'ob-persona':el=>{ const v=el.dataset.v; if(S.ob.persona!==v){ S.ob.persona=v; S.ob.band=null; S.ob.monthly=0; } render(true); },
  'ob-band':el=>{ const p=PERSONAS[S.ob.persona], b=p.bands.find(x=>x.id===el.dataset.v); S.ob.band=b.id; S.ob.monthly=defaultMonthly(p,b.mid); render(true); },
  'ob-goal':el=>{ const v=el.dataset.v, g=S.ob.goals, i=g.indexOf(v); if(i>=0) g.splice(i,1); else g.push(v); render(true); },
  'ob-vibe':el=>{ S.ob.vibe=el.dataset.v; render(true); },
  'ob-next':()=>{ const o=S.ob, ok=[!!o.persona,!!o.band,o.goals.length>0,!!o.vibe][o.step-1]; if(!ok) return; if(o.step<4){ o.step++; render(); return; } finishOnboarding(); },
  'plan-edit':el=>sheetGoalEdit(el.dataset.id),
  'ge-bucket':el=>{ S.edit.bucket=el.dataset.v; $$('[data-act="ge-bucket"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.edit.bucket))); },
  'ge-save':()=>{ const e=S.edit, g=goalById(e.id); if(g.longterm) g.forceBucket=(e.bucket==='growth'&&S.user.vibe!=='sell')?null:e.bucket; else { g.target=e.target; g.months=e.months; }
    assignBuckets(S.goals,S.user.vibe); allocate(S.goals,S.user.monthly); closeSheet(); render(true); },
  'ge-remove':()=>{ S.goals=S.goals.filter(x=>x.id!==S.edit.id); allocate(S.goals,S.user.monthly); closeSheet(); render(true); },
  'plan-monthly':()=>sheetMonthly(),
  'pm-save':()=>{ S.user.monthly=S.edit.monthly; allocate(S.goals,S.user.monthly); closeSheet(); render(true); },
  'plan-start':()=>sheetUPI(),
  'upi-app':el=>$$('[data-act="upi-app"]').forEach(b=>b.setAttribute('aria-pressed',String(b===el))),
  'upi-approve':el=>{ el.disabled=true; const w=$('#upi-wait'); if(w) w.hidden=false; later(()=>{ startPlan(); closeSheet(); go('success'); confetti(); },1300); },
  share:()=>toast('Milestone card ready to share. No amounts on it.'),
  'to-home':()=>tab('home'),
  calm:()=>toggleCalm(),
  'open-goal':el=>go('goal',{id:el.dataset.id}), 'open-dip':()=>go('dip'), 'open-fund':el=>go('fund',{id:el.dataset.id}), 'open-cat':el=>go('category',{id:el.dataset.id}),
  'open-sim':()=>go('sim'), 'open-tip':()=>go('tipcheck'), 'open-license':()=>go('license'),
  'stocks-info':()=>openSheet(`<h2 class="h2">Stocks, for first-timers</h2><p>Stocks live in the main Groww app. Our take: run your SIPs for three months first.</p><p class="small">Then try stocks with 10% or less of what you invest, spread across a few companies. ${T('div','Diversification')} keeps one bad pick from sinking you.</p><button type="button" class="btn" data-act="sheet-close">Got it</button>`,'Stocks'),
  'open-payday':()=>{ if(S.payday) sheetPayday(); },
  'pd-invest':()=>{ const amt=r50(S.payday.amount*S.pdPct); if(amt<=0) return; for(const r of paySplit(amt)){ r.g.invested+=r.v; r.g.value+=r.v; } S.payday=null; closeSheet(); render(true); toast(`Invested ${inr(amt)}. Future-you says thanks.`); },
  'pd-skip':()=>{ S.payday=null; closeSheet(); render(true); toast('Skipped. Your SIPs still run on the 5th.'); },
  'roundup-on':()=>{ S.roundups={on:true,goalId:defaultRoundupGoal(),pending:142,count:23}; render(true); toast('Round-ups on.'); },
  'roundup-dismiss':()=>{ S.roundupDismissed=true; render(true); },
  sweep:()=>{ const r=S.roundups, g=goalById(r.goalId)||S.goals[0], v=r.pending; g.value+=v; g.invested+=v; r.pending=0; r.count=0; render(true); toast(`Swept ${inr(v)} into ${g.name}.`); },
  'roundup-goal':()=>openSheet(`<h2 class="h2">Send round-ups to…</h2><ul>${S.goals.map(g=>`<li><button type="button" class="lrow" data-act="rg-pick" data-id="${g.id}"><span class="ico ${g.bucket}" aria-hidden="true">${ic(g.icon)}</span><span><b>${esc(g.name)}</b></span></button></li>`).join('')}</ul>`,'Round-up goal'),
  'rg-pick':el=>{ S.roundups.goalId=el.dataset.id; closeSheet(); render(true); },
  'open-lesson':el=>openStory(el.dataset.id),
  'add-goal':()=>sheetAddGoal(),
  'addgoal-pick':el=>{ const g=addGoal(el.dataset.v); closeSheet(); render(true); toast(`Added ${g.name} at ${inr(g.sip)} a month.`); },
  'add-money':el=>sheetAddMoney(el.dataset.id),
  'am-pick':el=>{ S.am=+el.dataset.v; const i=$('#am-in'); if(i) i.value=String(S.am); updateAddMoney(); },
  'am-confirm':()=>{ const g=goalById(S.amGoal), v=S.am; if(!g||!(v>=100&&v<=1000000)) return; g.value+=v; g.invested+=v; closeSheet(); render(true); toast(`Added ${inr(v)} to ${g.name}.`); },
  'sip-change':el=>sheetSipChange(el.dataset.id),
  'sc-save':()=>{ const g=goalById(S.edit.id); g.sip=S.edit.sip; S.user.monthly=S.goals.reduce((s,x)=>s+x.sip,0); closeSheet(); render(true); toast(`${g.name} SIP is now ${inr(g.sip)} a month.`); },
  'sip-pause':el=>sheetPause(el.dataset.id), 'pp-pick':el=>sheetPause(el.dataset.id),
  'pause-1':el=>{ const g=goalById(el.dataset.id); g.paused=true; g.pauseLeft=1; closeSheet(); render(true); toast('Paused for one month. It restarts on its own.'); },
  'pause-x':el=>{ const g=goalById(el.dataset.id); g.paused=true; g.pauseLeft=Infinity; closeSheet(); render(true); toast('Paused. Resume anytime from the goal page.'); },
  'sip-resume':el=>{ const g=goalById(el.dataset.id); g.paused=false; g.pauseLeft=0; render(true); toast(`${g.name} SIP resumed.`); },
  'switch-bucket':el=>{ const g=goalById(el.dataset.id), b=g.bucket==='growth'?'balanced':'growth'; g.bucket=b; g.forceBucket=b; g.fundId=BUCKETS[b].fund; g.softened=false; render(true); toast(`New SIPs for ${g.name} now go to ${FUNDS[g.fundId].name}.`); },
  'fund-use':el=>sheetFundUse(el.dataset.id),
  'fu-pick':el=>{ const g=goalById(el.dataset.id), f=FUNDS[el.dataset.fund], rec=bucketFor(g);
    if(BUCKETS[f.bucket].rank>BUCKETS[rec].rank) openSheet(`<h2 class="h2">Heads up</h2><p>${esc(f.name)} swings more than a goal ${horizonLabel(Math.max(1,g.months-goalAge(g)))} away usually should. A ${BUCKETS[rec].label} fund fits ${esc(g.name)} better.</p><button type="button" class="btn" data-act="sheet-close">Keep the current fund</button><button type="button" class="btn quiet" data-act="fu-apply" data-id="${g.id}" data-fund="${f.id}">Use it anyway</button>`,'Heads up');
    else applyFund(g,f); },
  'fu-apply':el=>applyFund(goalById(el.dataset.id),FUNDS[el.dataset.fund]),
  'sim-b':el=>{ S.sim.bucket=el.dataset.v; render(true); },
  term:el=>openTerm(el.dataset.term),
  'term-lang':el=>{ S.lang=el.dataset.v; openTerm(el.dataset.term); render(true); },
  lang:el=>{ S.lang=el.dataset.v; render(true); },
  theme:el=>{ S.theme=el.dataset.v==='system'?null:el.dataset.v; applyTheme(); render(true); },
  toggle:el=>{ const k=el.dataset.v;
    if(k==='calm') return toggleCalm();
    if(k==='autopilot'){ S.autopilot=!S.autopilot; render(true); return toast(S.autopilot?'Payday autopilot on.':'Payday autopilot off.'); }
    if(k==='roundups'){ if(S.roundups.on) S.roundups.on=false; else S.roundups={on:true,goalId:defaultRoundupGoal(),pending:142,count:23}; render(true); toast(S.roundups.on?'Round-ups on.':'Round-ups off.'); } },
  nudge:el=>{ S.nudged[el.dataset.v]=true; render(true); toast(`Nudge sent to ${el.dataset.v}.`); },
  invite:()=>toast('Invite link copied.'),
  'join-trip':()=>{ const g=addGoal('trip'); render(true); toast(`Trip goal added at ${inr(g.sip)} a month.`); },
  'dip-keep':()=>{ tab('home'); toast(`Plan unchanged. Next SIP goes in on ${dayMonth(nextSip())}.`); },
  'dip-extra':()=>{ const g=S.goals.slice().sort((a,b)=>BUCKETS[b.bucket].rank-BUCKETS[a.bucket].rank)[0]; sheetAddMoney(g.id); },
  'dip-pause':()=>sheetPausePick(),
  'lic-open':el=>{ const n=+el.dataset.v; S.license.open=S.license.open===n?0:n; render(true); },
  'lic-read':()=>{ S.license.reality=true; S.license.open=2; render(true); },
  'lic-round':()=>{ const L=S.license; let f=1; for(let d=0;d<5;d++) f*=1+(.0003+.012*gauss(Math.random)); const move=f-1, fund=5000*(1+move); let fut=5000+50000*move-40; const wiped=fut<=0; if(wiped) fut=0;
    L.rounds.push({move,fund,fut,wiped}); if(L.rounds.length===3) L.open=3; render(true); },
  'lic-pick':el=>{ const L=S.license; if(L.passed) return; L.quiz[+el.dataset.q]=+el.dataset.o; L.quizScore=null; render(true); },
  'lic-check':()=>{ const L=S.license; if(Object.keys(L.quiz).length<LIC_QUIZ.length) return; L.quizScore=LIC_QUIZ.reduce((s,q,i)=>s+(L.quiz[i]===q.a?1:0),0); L.passed=L.quizScore>=3; if(L.passed){ L.open=4; toast(`Passed: ${L.quizScore} of 4.`); } render(true); },
  'lic-ack':()=>{ S.license.ack=!S.license.ack; render(true); },
  'lic-apply':()=>{ const L=S.license; if(!L.ack) return; L.status='cooling'; L.coolUntil=Date.now()+864e5; L.open=0; render(true); toast('Applied. Your 24-hour cool-off has started.'); },
  'lic-skip':()=>{ S.license.status='active'; render(true); toast('License active.'); },
  'tip-sample':el=>{ S.tip.text=TIP_SAMPLES[+el.dataset.i].text; const t=$('[data-in="tip"]'); if(t) t.value=S.tip.text; },
  'tip-check':()=>{ if(!S.tip.text.trim()) return toast('Paste a message first.'); S.tip.result=tipScore(S.tip.text); const o=$('#tip-out'); if(o) o.innerHTML=tipResult(S.tip.result); },
  'story-next':()=>{ const st=S.story, L=LESSONS.find(l=>l.id===st.id); if(st.i<L.slides.length){ st.i++; renderStory(); } },
  'story-prev':()=>{ if(S.story.i>0){ S.story.i--; renderStory(); } },
  'story-answer':el=>{ const st=S.story; if(st.answer!==null) return; const L=LESSONS.find(l=>l.id===st.id), k=+el.dataset.k; st.answer=k;
    if(!S.done[L.id]){ st.gained=10+(k===L.quiz.a?20:0); S.xp+=st.gained; S.done[L.id]=true; } else st.gained=0; renderStory(); },
  'story-close':()=>{ closeStory(); render(true); },
  'demo-open':()=>openSheet(`<h2 class="h2">Demo controls</h2>${tourHTML()}${prefsHTML()}`,'Demo controls'),
  'demo-restart':()=>resetAll(),
  'demo-sample':()=>{ loadSample(); toast('Sample user loaded: Arjun, first job.'); },
  'demo-payday':()=>{ ensureStarted(); if(!S.autopilot){ tab('home'); return toast('Payday autopilot is off. Turn it on in You.'); } S.payday={amount:paydayAmount(),source:PERSONAS[S.user.persona].source}; tab('home'); toast(`${inr(S.payday.amount)} landed. Check Home.`); },
  'demo-dip':()=>{ ensureStarted(); if(S.market==='dip'){ endDip(); tab('home'); toast('Market back to normal.'); } else { startDip(); tab('home'); toast('Nifty 50 fell 4.1% today.'); } },
  'demo-ff':()=>{ ensureStarted(); fastForward(6); tab('home'); toast('Six months later…'); },
  'demo-license':()=>{ ensureStarted(); S.hist=[]; S.route='explore'; S.params={}; go('license'); },
  'demo-tip':()=>{ ensureStarted(); S.hist=[]; S.route='explore'; S.params={}; go('tipcheck'); },
  'demo-lang':()=>{ const inSheet=!!$('#sheet-root .tour'); S.lang=S.lang==='hi'?'en':'hi'; render(true); if(inSheet) ACT['demo-open'](); toast(S.lang==='hi'?'Explanations in Hinglish.':'Explanations in English.'); },
  'demo-theme':()=>{ const inSheet=!!$('#sheet-root .tour'); S.theme=isDark()?'light':'dark'; applyTheme(); render(true); if(inSheet) ACT['demo-open'](); }
};
let simRaf=0;
function updateSim(){ setText('#sim-m-v',inr(S.sim.monthly)); setText('#sim-y-v',`${S.sim.years} year${S.sim.years>1?'s':''}`);
  const draw=()=>{ const o=$('#sim-out'); if(o) o.innerHTML=futuresBlock(simCurrent(),{label:'Simulated futures'}); };
  if(FAST()||!window.requestAnimationFrame) return draw(); cancelAnimationFrame(simRaf); simRaf=requestAnimationFrame(draw); }
const IN={
  'ob-name':el=>{ S.ob.name=el.value; },
  'ob-amt':el=>{ S.ob.monthly=+el.value; setText('#ob-amt-v',inr(S.ob.monthly)); const b=PERSONAS[S.ob.persona].bands.find(x=>x.id===S.ob.band), c=comfort(S.ob.monthly,b.mid), p=$('#ob-comfort'); if(p){ p.className='comfort '+c.cls; p.textContent=c.text; } },
  'ge-target':el=>{ S.edit.target=+el.value; setText('#ge-t',inr(S.edit.target)); setText('#ge-b',editPreview()); },
  'ge-months':el=>{ S.edit.months=+el.value; setText('#ge-m',horizonLabel(S.edit.months)); setText('#ge-b',editPreview()); },
  pm:el=>{ S.edit.monthly=+el.value; setText('#pm-v',inr(S.edit.monthly)); },
  pd:el=>{ S.pdPct=+el.value/100; updatePayday(); },
  am:el=>{ S.am=Math.round(+String(el.value).replace(/[^\d]/g,'')||0); updateAddMoney(); },

  'sim-y':el=>{ S.sim.years=+el.value; updateSim(); },
  'lic-ll':el=>{ S.license.lossLimit=+el.value; setText('#lic-ll-v',inr(S.license.lossLimit)); },
  tip:el=>{ S.tip.text=el.value; },
  search:el=>{ S.q=el.value; const r=$('#search-results'); if(r) r.innerHTML=searchResults(); }
};

/* ===== boot ===== */
function boot(){
  $('#tabbar').innerHTML=TABS.map(t=>`<button type="button" class="tab" data-act="tab" data-tab="${t.id}">${ic(t.icon)}<span>${t.label}</span></button>`).join('');
  document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const fn=ACT[el.dataset.act]; if(!fn) return; e.preventDefault(); fn(el,e); });
  document.addEventListener('input',e=>{ const el=e.target.closest('[data-in]'); if(el&&IN[el.dataset.in]) IN[el.dataset.in](el,e); });
  document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(S.story) closeStory(); else closeSheet(); });
  applyTheme(); render();
  window.__app={get S(){return S;},render,go,tab,back,allocate,simulate,tipScore,bucketFor,makeGoals,assignBuckets,newGoal,startDip,endDip,fastForward,
    JARGON,LESSONS,FUNDS,PERSONAS,BUCKETS,GOAL_TYPES,TIP_SAMPLES,LIC_QUIZ,CATS,
    act:(name,data={})=>{ const el=document.createElement('button'); Object.assign(el.dataset,data); ACT[name](el); }};
}
boot();

})();
